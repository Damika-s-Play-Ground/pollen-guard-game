name: Deploy Pollen Guard Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare game-only site artifact
        run: |
          mkdir -p _site
          cp index.html game.js favicon.svg manifest.webmanifest service-worker.js offline-assets.json _site/
          cp -R src _site/src
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
